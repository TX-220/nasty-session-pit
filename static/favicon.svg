    <linearGradient id="ring" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4a0ff"/>
      <stop offset="50%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#7b4dff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0d0514"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#3a1840" stroke-width="1"/>
  <circle cx="16" cy="16" r="12" fill="url(#pit)"/>
  <!-- session spiral / pit rings -->
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="url(#ring)" stroke-width="1.2" opacity="0.85"/>
  <circle cx="16" cy="16" r="7.2" fill="none" stroke="#ff2d95" stroke-width="1" opacity="0.55"/>
  <path
    fill="none"
