  />
  <path
    fill="none"
    stroke="#ff2d95"
    stroke-width="1.1"
    stroke-linecap="round"
    opacity="0.9"
    d="M16 25.5c-4.8 0-8.5-3.2-8.5-7.2 0-2.6 1.5-4.9 3.8-6.2"
