<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nasty Session Pit">
  <defs>
    <radialGradient id="pit" cx="16" cy="16" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a0a28"/>
      <stop offset="45%" stop-color="#12081c"/>
      <stop offset="100%" stop-color="#0a0410"/>
    </radialGradient>
    <radialGradient id="core" cx="16" cy="16" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6bb8"/>
      <stop offset="55%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#e91e8c" stop-opacity="0"/>
